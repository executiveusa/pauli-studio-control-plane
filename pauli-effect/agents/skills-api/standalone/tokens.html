<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Tracker - The Pauli Effect</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;padding:20px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin-bottom:8px;color:#a78bfa}
p{color:#888;font-size:14px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#141420;border:1px solid #2a2a3a;border-radius:12px;padding:16px}
.stat .label{font-size:12px;color:#888;margin-bottom:4px}
.stat .value{font-size:24px;font-weight:bold}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:#141420;border:1px solid #2a2a3a;border-radius:12px;padding:16px}
.chart-box h3{font-size:14px;margin-bottom:12px;color:#a78bfa}
.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:10px 12px;border-bottom:1px solid #1a1a2a;font-size:13px}
.table th{color:#888;font-size:11px;text-transform:uppercase}
.table td{color:#e0e0e0}
select{padding:8px 12px;border-radius:8px;border:1px solid #2a2a3a;background:#0d0d15;color:#e0e0e0;font-size:13px}
.filters{margin-bottom:20px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Token Spend & Savings</h1>
<p>The Pauli Effect fleet token usage tracker.</p>
<div class="filters">
<select id="period" onchange="load()">
<option value="24h">Last 24 hours</option>
<option value="7d">Last 7 days</option>
<option value="30d">Last 30 days</option>
</select>
</div>
<div class="stats" id="stats"></div>
<div class="charts">
<div class="chart-box"><h3>Tokens by Agent</h3><canvas id="agentChart"></canvas></div>
<div class="chart-box"><h3>Cost by Model</h3><canvas id="modelChart"></canvas></div>
</div>
<div class="chart-box"><h3>Per-Agent Breakdown</h3>
<table class="table" id="breakdown"><thead><tr><th>Agent</th><th>Model</th><th>Tokens In</th><th>Tokens Out</th><th>Cost</th><th>Calls</th></tr></thead><tbody></tbody></table>
</div>
<script>
const API="http://31.220.58.212:4820";
let agentChart,modelChart;
const COLORS=["#a78bfa","#34d399","#f59e0b","#f87171","#60a5fa","#c084fc"];
async function load(){
const period=document.getElementById("period").value;
try{
const r=await fetch(API+"/tokens/spend?period="+period);
const d=await r.json();
renderStats(d);
renderCharts(d);
renderTable(d);
}catch(e){document.getElementById("stats").innerHTML='<div class="stat"><div class="label">Error</div><div class="value" style="font-size:14px">'+e.message+"</div></div>"}
}
function renderStats(d){
const t=d.totals||{};
const totalTokens=(t.total_in||0)+(t.total_out||0);
document.getElementById("stats").innerHTML=[
{label:"Total Tokens",value:totalTokens.toLocaleString()},
{label:"Total Cost",value:"$"+((t.total_cost||0).toFixed(4))},
{label:"Total Calls",value:t.calls||0},
{label:"Avg Cost/Call",value:"$"+(t.calls>0?((t.total_cost||0)/t.calls).toFixed(6):"0.00")}
].map(s=>'<div class="stat"><div class="label">'+s.label+'</div><div class="value">'+s.value+"</div></div>").join("");
}
function renderCharts(d){
const byAgent={};
(d.by_agent_model||[]).forEach(r=>{
if(!byAgent[r.agent])byAgent[r.agent]={tokens:0,cost:0};
byAgent[r.agent].tokens+=r.total_in+r.total_out;
byAgent[r.agent].cost+=r.total_cost;
});
const agentLabels=Object.keys(byAgent);
const agentTokens=agentLabels.map(a=>byAgent[a].tokens);
if(agentChart)agentChart.destroy();
agentChart=new Chart(document.getElementById("agentChart"),{type:"bar",data:{labels:agentLabels,datasets:[{data:agentTokens,backgroundColor:COLORS.slice(0,agentLabels.length)}]},options:{indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#888"}},y:{ticks:{color:"#888"}}}}});
const byModel={};
(d.by_agent_model||[]).forEach(r=>{
if(!byModel[r.model])byModel[r.model]=0;
byModel[r.model]+=r.total_cost;
});
const modelLabels=Object.keys(byModel);
const modelCosts=modelLabels.map(m=>byModel[m]);
if(modelChart)modelChart.destroy();
modelChart=new Chart(document.getElementById("modelChart"),{type:"doughnut",data:{labels:modelLabels,datasets:[{data:modelCosts,backgroundColor:COLORS.slice(0,modelLabels.length)}]},options:{plugins:{legend:{labels:{color:"#888",font:{size:11}}}}}});
}
function renderTable(d){
const tbody=document.querySelector("#breakdown tbody");
tbody.innerHTML="";
(d.by_agent_model||[]).forEach(r=>{
tbody.innerHTML+="<tr><td>"+r.agent+"</td><td>"+r.model+"</td><td>"+r.total_in.toLocaleString()+"</td><td>"+r.total_out.toLocaleString()+"</td><td>$"+r.total_cost.toFixed(4)+"</td><td>"+r.calls+"</td></tr>";
});
if(!d.by_agent_model||d.by_agent_model.length===0){
tbody.innerHTML="<tr><td colspan='6' style='text-align:center;color:#888'>No token usage recorded yet</td></tr>";
}
}
load();
</script>
</body>
</html>
