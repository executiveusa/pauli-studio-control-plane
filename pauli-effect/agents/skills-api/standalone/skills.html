<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Library - The Pauli Effect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;padding:20px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin-bottom:8px;color:#a78bfa}
p{color:#888;font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#141420;border:1px solid #2a2a3a;border-radius:12px;padding:16px;transition:border-color .2s}
.card:hover{border-color:#7c3aed}
.card h3{font-size:14px;margin-bottom:8px;color:#e0e0e0}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;border:1px solid;margin-right:4px;margin-bottom:4px}
.badge-shelf{border-color:#3a3a4a;color:#888}
.badge-gated{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.1)}
select,button{padding:8px 12px;border-radius:8px;border:1px solid #2a2a3a;background:#0d0d15;color:#e0e0e0;font-size:13px}
button{background:#7c3aed;border:none;cursor:pointer;color:white}
button:hover{background:#6d28d9}
button:disabled{opacity:.5;cursor:not-allowed}
.filters{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.result{margin-top:20px;background:#0d0d15;border:1px solid #2a2a3a;border-radius:8px;padding:16px}
.result pre{white-space:pre-wrap;font-size:12px;color:#a0a0b0}
.count{color:#888;font-size:13px}
</style>
</head>
<body>
<h1>Skills Library</h1>
<p>The Pauli Effect fleet skills catalog. <span id="count" class="count">Loading...</span></p>
<div class="filters">
<select id="shelfFilter"><option value="all">All Shelves</option></select>
<select id="agentSelect"><option value="jarvis">Jarvis</option><option value="tars">TARS</option><option value="pi">Pi</option><option value="hermes">Hermes</option></select>
</div>
<div class="grid" id="skillsGrid"></div>
<div class="result" id="resultBox" style="display:none"><h3 style="margin-bottom:8px">Execution Result</h3><pre id="resultContent"></pre></div>
<script>
const API="http://31.220.58.212:4820";
let allSkills=[];
async function load(){
try{
const r=await fetch(API+"/skills");
const d=await r.json();
allSkills=d.skills||[];
document.getElementById("count").textContent=allSkills.length+" skills available";
const shelves=[...new Set(allSkills.map(s=>s.shelf))].sort();
const sel=document.getElementById("shelfFilter");
shelves.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;sel.appendChild(o)});
render(allSkills);
}catch(e){document.getElementById("count").textContent="Error loading skills: "+e.message}
}
function render(skills){
const grid=document.getElementById("skillsGrid");
grid.innerHTML="";
skills.forEach(s=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML="<h3>"+s.name+"</h3>"+
(s.gated?'<span class="badge badge-gated">GATED</span>':'')+
'<span class="badge badge-shelf">'+s.shelf+"</span>"+
(s.access.includes("all")?'<span class="badge badge-shelf">ALL</span>':"")+
'<div style="margin-top:12px"><button onclick="execute(\''+s.id+"','"+
s.name+"',"+s.gated+')">Execute</button></div>';
grid.appendChild(card);
});
}
document.getElementById("shelfFilter").addEventListener("change",e=>{
const v=e.target.value;
render(v==="all"?allSkills:allSkills.filter(s=>s.shelf===v));
});
async function execute(id,name,gated){
const agent=document.getElementById("agentSelect").value;
const ctx=prompt("Context for "+name+" (optional):")||"";
document.getElementById("resultBox").style.display="block";
document.getElementById("resultContent").textContent="Executing...";
try{
const r=await fetch(API+"/skills/"+id+"/execute",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({agent,context:ctx,confirmed:!gated})
});
const d=await r.json();
if(d.requires_confirmation){
if(confirm("This skill requires confirmation. Run "+name+"?")){
const r2=await fetch(API+"/skills/"+id+"/execute",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({agent,context:ctx,confirmed:true})
});
const d2=await r2.json();
document.getElementById("resultContent").textContent=d2.error?"Error: "+d2.error+" - "+(d2.message||""):(d2.result||JSON.stringify(d2,null,2));
}else{document.getElementById("resultBox").style.display="none";return}
}else{document.getElementById("resultContent").textContent=d.error?"Error: "+d.error+" - "+(d.message||""):(d.result||JSON.stringify(d,null,2))}
}catch(e){document.getElementById("resultContent").textContent="Request failed: "+e.message}
}
load();
</script>
</body>
</html>
